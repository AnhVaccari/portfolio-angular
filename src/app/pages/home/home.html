<main class="min-h-screen bg-amber-50">
  <section class="max-w-7xl mx-auto px-6 lg:px-8 py-16 lg:py-24">
    <div class="grid lg:grid-cols-2 gap-12 lg:gap-16 items-center">
      <!-- Colonne gauche -->
      <div class="space-y-8">
        <div class="flex items-center space-x-2 text-gray-600">
          <span class="text-2xl">👋 ,</span>
          <span class="text-lg font-medium tracking-wider">JE SUIS ANH</span>
        </div>

        <h1 class="text-4xl lg:text-4xl xl:text-4xl font-bold text-gray-600 leading-tight">
          Développeuse Full - Stack <br />
          <span class="text-gray-600">Java - Angular</span>
        </h1>

        <p class="text-xl text-gray-600 font-medium">Basée à Toulouse</p>

        <div class="pt-2 pb-6 md:pt-4 md:pb-4">
          <a
            routerLink="/contact"
            class="inline-block bg-orange-500 hover:bg-orange-600 active:bg-black text-white font-semibold px-8 py-4 shadow-[4px_4px_0px_rgba(0,0,0,1)] hover:shadow-[2px_2px_0px_rgba(0,0,0,1)] transform hover:translate-x-1 hover:translate-y-1 active:translate-x-2 active:translate-y-2 active:shadow-[1px_1px_0px_rgba(0,0,0,1)] transition-all text-lg"
          >
            COMMENÇONS
          </a>
        </div>
      </div>

      <!-- Colonne droite  -->
      <div class="relative lg:h-[520px] flex items-center justify-center">
        <!-- Fond jaune -->
        <div
          class="absolute -top-20 right-0 w-[800px] h-[250px] bg-[#f7e9b7] rounded-[56px] -rotate-15"
        ></div>

        <!-- Carte gauche -->
        <div
          class="absolute -left-10 top-0 w-[340px] h-[380px] bg-[#aeedf5] rounded-t-[150px] border-[8px] border-[#f7c1c1] overflow-hidden shadow-[0_10px_25px_rgba(0,0,0,0.18)]"
        >
          <div
            class="w-70 h-full bg-no-repeat"
            style="
              background-image: url('/assets/images/profil_3.jpg');
              background-size: 90%;
              background-position: 20% 2%;
            "
          ></div>
        </div>

        <!-- Carte droite -->
        <div
          class="relative z-10 w-[380px] h-[460px] bg-[#d68b8c] rounded-t-[170px] border-[12px] border-[#9dd9e0] overflow-hidden shadow-[0_18px_35px_rgba(0,0,0,0.25)] translate-x-20 translate-y-10"
        >
          <div
            class="w-80 h-96 shadow-xl mx-auto overflow-hidden mt-6 rounded-t-[8rem] rounded-b-2xl"
          >
            <img
              src="/assets/images/bureau.png"
              alt="Mon bureau"
              class="w-full h-full object-cover"
            />
          </div>
        </div>

        <!-- Étoile + petite étoile -->
        <div class="absolute top-2 left-3 text-4xl text-black">✦</div>

        <div class="absolute top-20 right-12 text-5xl text-orange-400">✶</div>

        <!-- Étincelles -->
        <div class="absolute -top-8 left-35 text-7xl text-orange-400">✨</div>

        <div class="absolute -bottom-6 left-20 text-black" style="font-size: 8rem">≈</div>
      </div>
    </div>
  </section>
</main>
